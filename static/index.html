    const angle = 2 * Math.acos(Math.min(1, Math.abs(need.w)));
    if (angle > ARM_FIX_MAX) need.slerp(_IDENTITY, 1 - ARM_FIX_MAX / angle);
    armFix[side].slerp(need, k);
    u.quaternion.copy(armFix[side]).multiply(before[side]);
    u.updateWorldMatrix(false, true);
  }
  if (FEET) keepLegsApart(k);
}

// Ноги друг сквозь друга: в позах из пака поднятая нога прижимается к опорной и уходила в неё.
// Двигаем одну ногу — ту, что стоит слабее (поднятую), поворотом в бедре: колено, голень и
// стопа выходят из бедра и голени другой ноги. Стоящую ногу затем снова ставим на её место.
const legFix = { left: new THREE.Quaternion(), right: new THREE.Quaternion() };
const _m = new V3(), _o = new V3();
const SHOE_PAD = 0.008;

// точки ноги: голень и стопа [точка, толщина]; низ бедра — только против голени другой ноги
// (бёдра у самого паха касаются всегда, их не разводим)
function legPoints(side) {
  const at = (n) => vrm.humanoid.getNormalizedBoneNode(side + n)?.getWorldPosition(new V3());
  const hip = at('UpperLeg'), knee = at('LowerLeg'), ankle = at('Foot'), toes = at('Toes');
  const foot = bone(side + 'Foot').matrixWorld, mirror = side === 'left' ? 1 : -1;
  return {
    shin: [knee, knee.clone().lerp(ankle, 0.33), knee.clone().lerp(ankle, 0.66), ankle, ...(toes ? [toes] : [])],
    shoe: (body.shoe || []).map((p) => new V3(mirror * p.x, p.y, p.z).applyMatrix4(foot)),
    thigh: [0.5, 0.75].map((t) => hip.clone().lerp(knee, t)),
  };
}

function keepLegsApart(k) {
  if (!legs.left) return;
  const kneeUp = (s) => legs[s].low.getWorldPosition(_m).y;
  const dw = legs.left.w - legs.right.w;
  const mover = dw < -0.1 ? 'left' : dw > 0.1 ? 'right' : kneeUp('left') > kneeUp('right') ? 'left' : 'right';
  const other = mover === 'left' ? 'right' : 'left';
  const thigh = body.parts.filter((p) => p.node === bone(other + 'UpperLeg'));
  const u = bone(mover + 'UpperLeg');
  const before = Object.fromEntries(SIDES.map((s) => [s, bone(s + 'UpperLeg').quaternion.clone()]));
  const shinO = new THREE.Line3(bone(other + 'LowerLeg').getWorldPosition(new V3()), bone(other + 'Foot').getWorldPosition(new V3()));
  for (let it = 0; it < 4; it++) {
    let deepest = 0, at = null;
    const dir = new V3();
    const pts = legPoints(mover);
    const check = (p, gap) => {
      shinO.closestPointToPoint(p, true, _o);
      const d = gap - p.distanceTo(_o);
      if (d > deepest) { deepest = d; at = p; dir.subVectors(p, _o).normalize(); }
    };
    for (const p of pts.shin) {
      const d = penetration(p, body.shin, _dir, thigh);
      if (d > deepest) { deepest = d; at = p; dir.copy(_dir); }
      check(p, 2 * body.shin);
    }
    for (const p of pts.thigh) check(p, 2.5 * body.shin);
    for (const p of pts.shoe) {
      const d = penetration(p, SHOE_PAD, _dir, thigh);
      if (d > deepest) { deepest = d; at = p; dir.copy(_dir); }
      check(p, body.shin + SHOE_PAD);
    }
    if (deepest < 0.002) break;
    swing(mover, at, dir, deepest + 0.002, u);
  }
  // поправку догоняем плавно, как у рук; у второй ноги её прежняя поправка плавно сходит на нет
  for (const s of SIDES) {
    const t = bone(s + 'UpperLeg');
    const need = s === mover ? t.quaternion.clone().multiply(before[s].clone().invert()) : _qw.identity();
    legFix[s].slerp(need, k);
    t.quaternion.copy(legFix[s]).multiply(before[s]);
    t.updateWorldMatrix(false, true);
    if (legs[s].w >= 0.001 && Math.abs(legFix[s].w) < 0.99999) solveLeg(legs[s]);
  }
}

function solveArms() {
  // Ладони друг сквозь друга: расталкиваем обе руки поровну и только в стороны, по линии плеч.
  // Если толкать вдоль линии между точками, у скрещённых кистей она бывает вертикальной —
  // и одна рука уезжает вверх, другая вниз. Скрещённые кисти разводим до соприкосновения.
  const side = bone('leftUpperArm').getWorldPosition(new V3()).sub(bone('rightUpperArm').getWorldPosition(_dir)).normalize();
  for (let it = 0; it < 3; it++) {
    const L = armPoints('left').hand, R = armPoints('right').hand;
    let gap = 0, pl = null, pr = null;
    for (const a of L) for (const b of R) {
      _dir.subVectors(a, b);
      const across = _dir.dot(side);
      if (_dir.addScaledVector(side, -across).length() > 2.5 * body.hand) continue;  // не друг напротив друга
      const g = 2 * body.hand - across;
      if (g > gap) { gap = g; pl = a; pr = b; }
    }
    if (gap < 0.002) break;
    swing('left', pl, side, gap / 2 + 0.001);
    swing('right', pr, _dir.copy(side).negate(), gap / 2 + 0.001);
  }
  // руки сквозь грудь и бёдра
  for (const side of ['left', 'right']) {
    for (let it = 0; it < 4; it++) {
      const { arm, hand } = armPoints(side);
      let deepest = 0, at = null;
      const dir = new V3();
      for (const [list, rad] of [[arm, body.arm], [hand, body.hand * 1.4]]) for (const p of list) {
        const d = penetration(p, rad, _dir);
        if (d > deepest) { deepest = d; at = p; dir.copy(_dir); }
      }
      if (deepest < 0.002) break;
      swing(side, at, dir, deepest + 0.002);
    }
  }
}

// ---------- живость: взгляд, дыхание фразами, акценты, слушание ----------
// Взгляд не прибит к зрителю: глаза делают мелкие скачки, в речи и раздумье уходят в сторону,
// голова догоняет их с опозданием. Углы — от направления на зрителя: yaw вправо по экрану, pitch вверх.
const gazeTarget = new THREE.Object3D();
scene.add(gazeTarget);
const gaze = { yaw: 0, pitch: 0, eyeYaw: 0, eyePitch: 0, headYaw: 0, headPitch: 0, nextAt: 0, away: false, mode: '' };
const HEAD_FOLLOW = +opt('headfollow', 0.4);  // какую долю поворота взгляда берёт голова
const HEAD_SIGN = +opt('headsign', 1);
const BEAT_NOD = +opt('beatnod', 0.06), BEAT_BROW = +opt('beatbrow', 0.35);
const rand = (a, b) => a + Math.random() * (b - a);
const side = () => (Math.random() < 0.5 ? -1 : 1);
let lungs = 0, beat = 0, listen = 0, nodAt = Infinity, nodT = -1;

function lookTo(yaw, pitch, away) {
  // крупный перевод взгляда человек делает с морганием
  if (Math.hypot(yaw - gaze.yaw, pitch - gaze.pitch) > 0.18 && blinkT < 0) blinkT = 0;
  gaze.yaw = yaw; gaze.pitch = pitch; gaze.away = away;
}

function planGaze(t) {
  const mode = hearing ? 'listen' : thinking && !isSpeaking() ? 'think' : talk > 0.5 ? 'talk' : 'idle';
  if (mode !== gaze.mode) {
    // задумалась — уводит глаза вверх в сторону и держит; заговорила или слушает — возвращается
    if (mode === 'think') gaze.nextAt = t + 0.3;
    else if (gaze.mode === 'think' || mode === 'listen') { lookTo(0, 0, false); gaze.nextAt = t + rand(0.6, 1.4); }
    gaze.mode = mode;
  }
  if (t < gaze.nextAt) return;
  const micro = () => lookTo(rand(-0.03, 0.03), rand(-0.02, 0.02), false);  // с глаза на глаз собеседника
  if (mode === 'think') {
    if (!gaze.away) lookTo(side() * rand(0.2, 0.35), rand(0.1, 0.22), true);
    else lookTo(gaze.yaw + rand(-0.04, 0.04), gaze.pitch + rand(-0.03, 0.03), true);
    gaze.nextAt = t + rand(0.7, 1.6);
  } else if (gaze.away) { micro(); gaze.nextAt = t + rand(0.8, 2); }
  else if (mode === 'talk' && Math.random() < 0.3) {
    lookTo(side() * rand(0.12, 0.3), rand(-0.06, 0.14), true);
    gaze.nextAt = t + rand(0.5, 1.1);
  } else if (mode === 'idle' && Math.random() < 0.3) {
    lookTo(side() * rand(0.2, 0.5), rand(-0.15, 0.08), true);
    gaze.nextAt = t + rand(1, 2.5);
  } else { micro(); gaze.nextAt = t + (mode === 'listen' ? rand(0.9, 2.2) : rand(0.6, 1.8)); }
}

// Акценты речи: на нескольких самых протяжных ударных гласных фразы — кивок, брови, взмах предплечий.
// На каждом слоге не надо: это читается как тик.
function beatsOf(mouth, dur) {
  const stressed = mouth.filter((c) => c[3] >= 0.9).sort((a, b) => b[1] - b[0] - (a[1] - a[0]));
  const picked = [], most = Math.max(1, Math.round(dur / 1.5));
  for (const c of stressed) {
    if (picked.length >= most) break;
    if (picked.every((s) => Math.abs(s - c[0]) > 0.8)) picked.push(c[0]);
  }
  return picked;
}
const pulse = (x) => (x < -0.12 ? 0 : x < 0 ? smooth((x + 0.12) / 0.12) : Math.exp(-x / 0.25));

function alive(dt, t) {
  const now = ctx ? ctx.currentTime : 0;
  const playing = ctx && ctx.state === 'running';

  // взгляд: глаза прыгают почти мгновенно, голова плывёт следом
  if (!frozen) planGaze(t);
  gaze.eyeYaw += (gaze.yaw - gaze.eyeYaw) * Math.min(1, dt * 30);
  gaze.eyePitch += (gaze.pitch - gaze.eyePitch) * Math.min(1, dt * 30);
  gaze.headYaw += (HEAD_FOLLOW * gaze.yaw - gaze.headYaw) * Math.min(1, dt * 2.5);
  gaze.headPitch += (HEAD_FOLLOW * gaze.pitch - gaze.headPitch) * Math.min(1, dt * 2.5);
  const d = viewer.z;
  gazeTarget.position.set(viewer.x + d * Math.tan(gaze.eyeYaw), viewer.y + d * Math.tan(gaze.eyePitch), viewer.z);
  add('neck', 0, HEAD_SIGN * 0.5 * gaze.headYaw);
  add('head', -gaze.headPitch, HEAD_SIGN * 0.5 * gaze.headYaw);

  // дыхание фразами: вдох перед каждой фразой и пока думает над ответом, в речи — медленный выдох
  const inhale = (thinking && !isSpeaking()) || (playing && lines.some((l) => l.start > now && l.start - now < 0.35));
  lungs += ((inhale ? 1 : 0) - lungs) * Math.min(1, dt * (inhale ? 6 : talk > 0.5 ? 0.8 : 2));
  add('chest', -0.035 * lungs);
  arms('Shoulder', 0, 0, 0.03 * lungs);

  // акценты
  beat = 0;
  if (playing) for (const l of lines.slice(0, 2)) for (const b of l.beats) beat = Math.max(beat, pulse(now - l.start - b));
  if (frozen?.beat != null) beat = frozen.beat;
  add('head', BEAT_NOD * beat);
  arms('LowerArm', 0, 0.15 * beat * talk, 0);

  // слушает: чуть подаётся вперёд и иногда кивает, будто поддакивает
  listen += ((hearing ? 1 : 0) - listen) * Math.min(1, dt * 3);
  add('spine', 0.035 * listen);
  add('head', 0.03 * listen);
  if (!hearing) nodAt = Infinity;
  else if (nodAt === Infinity) nodAt = t + rand(1.2, 2.5);
  if (t >= nodAt) { nodT = 0; nodAt = t + rand(1.8, 4); }
  if (nodT >= 0) {
    nodT += dt;
    add('head', 0.09 * Math.sin(Math.min(1, nodT / 0.55) * Math.PI));
    if (nodT > 0.55) nodT = -1;
  }
}

function update(dt, t) {
  const em = vrm.expressionManager;
  stepMotion(frozen ? 0 : dt, t);

  // рот
  const target = lines[0] && lines[0].mouth.length ? cueTargets() : mouthTargets();
  let loud = 0;
  for (const k in mouth) {
    // открывается резко, закрывается мягче — так слоги не сливаются в кашу
    mouth[k] += (target[k] - mouth[k]) * Math.min(1, dt * (target[k] > mouth[k] ? 26 : 16));
    em.setValue(k, mouth[k]);
    loud = Math.max(loud, mouth[k]);
  }

  // стойка и покой: дыхание, перенос веса, руки чуть гуляют, голова осматривается
  for (const name of POSED) pose[name] = [...(STANCE[name] || [0, 0, 0])];
  root.y = 0; root.yaw = 0;
  for (const k in face) face[k] = 0;
  hand.left = hand.right = 1;
  ripple.left = ripple.right = 0;
  flat = 0;
  // С мокапом всё это уже есть в записи: синусы поверх живого движения дают дёрганую кашу.
  const calm = motion.base ? 0 : 1;
  const breath = Math.sin(t * 1.6) * (1 - talk) * calm;  // в речи дышит фразами, см. alive()
  add('chest', 0.012 * breath);
  arms('Shoulder', 0, 0, 0.012 * breath);
  const sway = Math.sin(t * 0.43) * calm;
  add('hips', 0, 0.02 * Math.sin(t * 0.27) * calm, 0.018 * sway);
  add('spine', 0, 0, -0.022 * sway);
  arms('UpperArm', 0, 0.03 * Math.sin(t * 0.71) * calm, 0.02 * Math.sin(t * 0.9) * calm);
  add('leftLowerArm', 0, -0.03 * Math.sin(t * 0.8) * calm);
  add('rightLowerArm', 0, 0.03 * Math.sin(t * 0.67 + 1) * calm);
  add('neck', 0, (0.06 * Math.sin(t * 0.37) + 0.04 * Math.sin(t * 0.13)) * calm);
  add('head', 0.025 * Math.sin(t * 0.61) * calm, 0, 0.03 * Math.sin(t * 0.29) * calm + (hearing ? 0.08 : 0));

  // Пока говорит — неторопливо жестикулирует: предплечья поднимаются и опускаются волнами,
  // кисти раскрываются. Головой на слоги не кивает: это читается как тик.
  talk += ((isSpeaking() && ctx.state === 'running' ? 1 : 0) - talk) * Math.min(1, dt * 3);
  if (frozen?.talk != null) talk = frozen.talk;
  if (frozen?.mouth) for (const k in mouth) em.setValue(k, mouth[k] = frozen.mouth[k] || 0);
  // если играет записанный «разговорный» цикл, руками жестикулирует он
  const ta = motion.baseKind === 'talk' ? 0 : talk;
  if (talk > 0.01) {
    const l = 0.5 + 0.5 * Math.sin(t * 1.3), r = 0.5 + 0.5 * Math.sin(t * 1.05 + 2.1);
    add('leftLowerArm', 0, -ta * (0.25 + 0.5 * l), -ta * 0.1 * l);
    add('rightLowerArm', 0, ta * (0.2 + 0.5 * r), ta * 0.1 * r);
    add('leftHand', -ta * 0.5 * l, 0, ta * 0.15 * Math.sin(t * 1.3 - 0.5));
    add('rightHand', -ta * 0.5 * r, 0, -ta * 0.15 * Math.sin(t * 1.05 + 1.6));
    arms('UpperArm', 0, ta * 0.08, ta * 0.05);
    add('spine', 0, 0.03 * talk * Math.sin(t * 0.9));
    add('head', 0.02 * talk * Math.sin(t * 0.8), 0.04 * talk * Math.sin(t * 1.1));
    hand.left -= 0.5 * ta * l;
    hand.right -= 0.5 * ta * r;
  }
  alive(dt, t);

  // жест по метке: по одному, остальные ждут очереди
  if (frozen) {
    GESTURES[frozen.name]?.fn(frozen.p, env(frozen.p), t);
    for (const a of frozen.add || []) add(...a);  // подбор позы руками: [['leftLowerArm', 0, -1.5, 0], ...]
  } else {
    if (!gesture && gestureQueue.length) {
      const name = gestureQueue.shift();
      gesture = { name, t0: t, clip: playGestureClip(name, t) };  // есть запись жеста — играет она
    }
    motion.armBlend = 0;
    if (gesture) {
      const g = GESTURES[gesture.name], p = (t - gesture.t0) / (gesture.clip?.duration ?? g?.dur ?? 0);
      if (p >= 1 || !gesture.clip && !g) gesture = null;
      else if (gesture.clip) {
        if (FLAT_HANDS.has(gesture.name)) { flat = env(p); hand.left = hand.right = 1 - flat; }
      } else {
        g.fn(p, env(p), t);
        if (ARM_GESTURES.has(gesture.name)) motion.armBlend = env(p);
      }
    }
  }

  // У живого человека руку выше плеча поднимает ещё и ключица. Если всю дугу отдать плечевой
  // кости, плечо проваливается в шею, а рукав встаёт колом.
  for (const [side, sign] of [['left', 1], ['right', -1]]) {
    const lift = CLAVICLE * Math.max(0, sign * pose[side + 'UpperArm'][2] + 0.5);
    pose[side + 'UpperArm'][2] -= sign * lift;
    pose[side + 'Shoulder'][2] += sign * lift;
  }

  const ease = frozen ? 1 : Math.min(1, dt * 13);
  for (const name of POSED) {
    const s = shown[name] ||= [...pose[name]];
    for (let i = 0; i < 3; i++) s[i] += (pose[name][i] - s[i]) * ease;
    if (motion.base) layerOnMotion(name, s);
    else bone(name).rotation.set(AX * s[0], s[1], AX * s[2]);
  }
  if (motion.base) keepArmsOut();
  flatShown += (flat - flatShown) * (frozen ? 1 : Math.min(1, dt * 9));
  for (const [side, sign] of [['left', -1], ['right', 1]]) {
    curl[side] += (hand[side] - curl[side]) * (frozen ? 1 : Math.min(1, dt * 9));
    const c = Math.max(0, curl[side]);
    // к мизинцу пальцы согнуты сильнее — так кисть выглядит живой, а не лопаткой
    // Пальцы ставим сами целиком: в записях Mixamo большой палец после переноса оттопырен.
    // Пальцы чуть дышат вместе — одной медленной волной от указательного к мизинцу, в разговоре
    // заметнее; раскрытая ладонь разводит их веером. Каждый палец в своём ритме — это уже тик.
    const still = 1 - flatShown, live = frozen ? 0 : FINGER_LIFE * (1 + talk) * still, open = Math.max(0, 1 - c);
    const ph = side === 'left' ? 0 : 2.3;
    // пальцы из записи жеста: запоминаем, что поставил миксер, и подмешиваем поверх своих
    const g = motion.gesture, fromClip = g?.fingers ? layers.get(g.action)?.w ?? 0 : 0;
    const clipQ = fromClip > 0.001 ? [...FINGERS, ...THUMB_BONES].map((f) => bone(side + f).quaternion.clone()) : null;
    FINGERS.forEach((f, i) => {
      const finger = Math.floor(i / 3), joint = i % 3;
      const wiggle = live * Math.sin(t * 0.7 + ph - 0.35 * finger)
        + ripple[side] * (0.5 + 0.5 * Math.sin(t * 13 - 1.1 * finger));
      const bend = c * (0.26 + 0.07 * finger) + wiggle * (joint ? 0.6 : 1);
      const fan = joint ? 0 : -sign * (finger - 1.5) * FINGER_FAN * (0.3 + open) * still;
      const z = AX * sign * bend;
      bone(side + f).rotation.set(0, fan, z + ((FLAT_Z[side + f] || 0) - z) * flatShown);
    });
    const tw = 0.5 * live * Math.sin(t * 0.7 + ph + 0.35);
    const tc = Math.max(c, 0.7 * flatShown);  // у прямой ладони большой палец прижат, а не оттопырен
    THUMB_POSE.forEach(([x, y, z], i) => bone(side + THUMB_BONES[i]).rotation.set(AX * x * tc, sign * y * tc, AX * sign * (z * tc + tw)));
    if (clipQ) [...FINGERS, ...THUMB_BONES].forEach((f, i) => bone(side + f).quaternion.slerp(clipQ[i], Math.min(1, fromClip)));
  }
  vrm.scene.position.y = 0;
  vrm.scene.rotation.y = baseYaw + root.yaw;
  let own = 0, total = 0;
  for (const [action, layer] of layers) { total += layer.w; if (movesRoot(action.getClip())) own += layer.w; }
  const ground = groundLift() * (1 - (total > 0 ? own / total : 0));
  vrm.scene.position.y = root.y - ground;
  plantFeet(dt, FEET && !FREE_FEET.has(gesture?.name) && Math.abs(root.yaw) < 1e-3);
  const hips = bone('hips').getWorldPosition(_v), air = Math.max(0, hips.y - hipsRest);
  shadow.position.set(hips.x, 0.002, hips.z);
  shadow.scale.setScalar(1 / (1 + air * 2));
  keepOutOfBody(dt);

  // лицо: эмоция по метке держится до конца фразы и ещё чуть-чуть
  const now = clockNow();
  const parts = hasFaceParts();
  for (const k of EMOTIONS) {
    // глаза-дуги проходим быстро: в промежутке глаза наполовину спрятаны
    emo[k] += ((emotion.name === k && now < emotion.until ? 0.85 : 0) - emo[k]) * Math.min(1, dt * (softFace.has(k) ? 12 : 5));
    // у чужих моделей остаётся готовая маска, но на время речи почти гасим её
    em.setValue(k, parts ? 0 : softFace.has(k) ? emo[k] / 0.85 : emo[k] * (1 - 0.75 * talk));
  }
  for (const k in face) em.setValue(k, face[k]);
  if (OUTFIT && em.getExpression(OUTFIT)) em.setValue(OUTFIT, 1);

  if (blinkT < 0 && t > blinkAt) blinkT = 0;
  if (blinkT >= 0) blinkT += dt;
  if (frozen?.emo) for (const k of EMOTIONS) emo[k] = k === frozen.emo ? 0.85 : 0;
  const squint = parts ? emo.happy * 0.65 : Math.min(1, [...softFace].reduce((m, k) => Math.max(m, emo[k] / 0.85), 0));  // глаза уже прищурены улыбкой — моргаем на остаток
  em.setValue('blink', blinkT < 0 ? 0 : Math.sin(Math.min(1, blinkT / 0.16) * Math.PI) * (1 - squint));
  if (blinkT > 0.16) { blinkT = -1; blinkAt = t + 1.5 + Math.random() * 4; }

  vrm.update(dt);

  if (parts) {
    const w = {};
    for (const k of EMOTIONS) for (const [key, v] of Object.entries(FACE_PARTS[k])) {
      const silent = key.startsWith('MTH') ? (1 - talk) + talk * (MOUTH_WHILE_TALKING[key] || 0) : 1;
      w[key] = (w[key] || 0) + emo[k] * v * silent;
    }
    w.BRW_Surprised = (w.BRW_Surprised || 0) + BEAT_BROW * beat;  // брови вскидываются на акценте
    w.MTH_Fun = (w.MTH_Fun || 0) + 0.25 * listen * (1 - talk);  // слушает с лёгкой улыбкой
    for (const key in w) for (const { mesh, index } of morphs[key] || []) mesh.morphTargetInfluences[index] = w[key];
  }
}

function frame() {
  requestAnimationFrame(frame);
  tick(Math.min(clock.getDelta(), 0.1), clock.elapsedTime);
}

function tick(dt, t) {
  if (ctx) {
    const now = ctx.currentTime;
    while (lines.length && lines[0].end <= now) lines.shift();
    const line = lines[0] && lines[0].start <= now ? lines[0].text : '';
    if ($('caption').textContent !== line && !$('caption').textContent.startsWith('Ошибка')) $('caption').textContent = line;
    if (!lines.length && $('status').textContent === 'говорю') setStatus();
    while (pendingActs.length && pendingActs[0].at <= now) {
      const due = pendingActs.shift();
      for (const name of due.acts) act(name, due.until);
    }
  }

  if (vrm) update(dt, t);
  renderer.render(scene, camera);
}
if (!RENDER) frame();

// ---------- ролик ----------
// Вместо звуковой карты — часы, которые двигает video/note.py: ctx.currentTime = время кадра. Звук страница
// не слышит вовсе: расписание фраз, рта и жестов приходит готовым из mika_voice.py (mikaLoad).
if (RENDER) {
  $('start').remove();  // остальной интерфейс в кадр не попадает: кадр берём с холста
  ctx = { currentTime: 0, state: 'running', sampleRate: TTS_RATE, resume() {} };
  analyser = { fftSize: 1024, getByteFrequencyData: (a) => a.fill(0) };  // рот только по расписанию
  // фон рисуем в самой сцене: в кадр с холста прозрачность ушла бы чёрным
  const sky = drawSky();
  scene.background = sky.texture;
  // готова ли страница: модель и записи движений загружены
  window.mikaReady = () => !!(vrm && motionsReady);
  // [{start, end, text, mouth, acts}] — фразы ролика по времени, как их сложил mika_voice.Voice.script
  window.mikaLoad = (clipLines) => {
    lines.length = pendingActs.length = 0;
    ctx.currentTime = nextTime = 0;
    for (const l of clipLines) {
      if (l.text) {
        lines.push({ start: l.start, end: l.end, text: l.text, mouth: l.mouth, at: 0, beats: beatsOf(l.mouth, l.end - l.start) });
        nextTime = Math.max(nextTime, l.end);
      }
      if (l.acts.length) pendingActs.push({ at: l.start, until: l.end, acts: l.acts });
    }
  };
  // кадр в момент t (с шагом dt от прошлого): JPEG в base64, или ничего, если shot = false (разогрев)
  window.mikaFrame = (t, dt, shot = true) => {
    ctx.currentTime = t;
    sky.draw(t);
    tick(dt, t);
    return shot ? renderer.domElement.toDataURL('image/jpeg', 0.92).split(',')[1] : null;
  };
}

// Астрологическое небо для кружочков: ночной градиент без чёрных краёв (в круге тёмные края читались как
// полосы), туманности, мерцающие звёзды и медленно вращающийся зодиакальный круг за спиной. Всё рисуется
// здесь же, по времени кадра, — без картинок со стороны. Значки знаков — из DejaVu Sans (есть в контейнере).
function drawSky(size = 640) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = Array.from({ length: 170 }, () => ({
    x: rnd() * size, y: rnd() * size, r: 0.4 + rnd() ** 3 * 1.6, speed: 0.6 + rnd() * 2.2, phase: rnd() * 6.28,
  }));
  const bright = Array.from({ length: 9 }, () => ({ x: rnd() * size, y: rnd() * size * 0.75, phase: rnd() * 6.28 }));
  const nebulae = [
    { x: 0.22, y: 0.3, r: 0.42, color: '255,120,200', a: 0.2 },
    { x: 0.8, y: 0.22, r: 0.38, color: '110,170,255', a: 0.18 },
    { x: 0.65, y: 0.85, r: 0.45, color: '170,110,255', a: 0.2 },
  ];
  const SIGNS = '♈♉♊♋♌♍♎♏♐♑♒♓';
  const cx = size / 2, cy = size * 0.42, R = size * 0.4;

  function draw(t) {
    const base = g.createRadialGradient(cx, cy, 0, cx, cy, size * 0.75);
    base.addColorStop(0, '#5a3a8f');
    base.addColorStop(0.55, '#33225f');
    base.addColorStop(1, '#241a4a');
    g.fillStyle = base;
    g.fillRect(0, 0, size, size);

    for (const n of nebulae) {  // туманности медленно дышат и плывут
      const x = (n.x + 0.03 * Math.sin(t * 0.07 + n.r * 9)) * size, y = (n.y + 0.03 * Math.cos(t * 0.05 + n.x * 7)) * size;
      const neb = g.createRadialGradient(x, y, 0, x, y, n.r * size);
      neb.addColorStop(0, `rgba(${n.color},${n.a * (0.85 + 0.15 * Math.sin(t * 0.3 + n.y * 5))})`);
      neb.addColorStop(1, `rgba(${n.color},0)`);
      g.fillStyle = neb;
      g.fillRect(0, 0, size, size);
    }

    for (const s of stars) {
      g.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      g.fillStyle = '#fff6e8';
      g.beginPath();
      g.arc(s.x, s.y, s.r, 0, 6.2832);
      g.fill();
    }
    for (const b of bright) {  // крупные звёзды-искры с лучами
      const k = 0.6 + 0.4 * Math.sin(t * 1.3 + b.phase), L = 7 * k;
      g.globalAlpha = 0.9 * k;
      g.strokeStyle = '#fff3d6';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(b.x - L, b.y); g.lineTo(b.x + L, b.y);
      g.moveTo(b.x, b.y - L); g.lineTo(b.x, b.y + L);
      g.stroke();
      g.beginPath();
      g.arc(b.x, b.y, 1.6, 0, 6.2832);
      g.fillStyle = '#ffffff';
      g.fill();
    }
    g.globalAlpha = 1;

    // зодиакальный круг: два золотых кольца, деления и знаки; оборот — за десять минут
    const turn = t * 0.0105;
    g.save();
    g.translate(cx, cy);
    g.strokeStyle = 'rgba(255,214,150,0.32)';
    g.lineWidth = 1.5;
    for (const r of [R, R * 0.82]) { g.beginPath(); g.arc(0, 0, r, 0, 6.2832); g.stroke(); }
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(255,214,150,0.22)';
    g.beginPath(); g.arc(0, 0, R * 1.06, 0, 6.2832); g.stroke();
    g.fillStyle = 'rgba(255,224,170,0.55)';
    g.font = `${Math.round(size * 0.04)}px "DejaVu Sans", "Segoe UI Symbol", sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (let i = 0; i < 12; i++) {
      const a = turn + (i / 12) * 6.2832, d = a + 6.2832 / 24;
      g.strokeStyle = 'rgba(255,214,150,0.3)';
      g.beginPath();
      g.moveTo(Math.cos(a) * R * 0.82, Math.sin(a) * R * 0.82);
      g.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      g.stroke();
      g.fillText(SIGNS[i] + '︎', Math.cos(d) * R * 0.91, Math.sin(d) * R * 0.91);
    }
    g.restore();
    texture.needsUpdate = true;
  }
  draw(0);
  return { texture, draw };
}

// для отладки из консоли: mika.act('wave'); mika.snap('think', 0.5) — застыть в середине жеста;
// mika.snap('', 0, { emo: 'happy', talk: 1, mouth: { aa: 1 } }) — застыть с лицом; mika.snap() — отпустить
window.mika = {
  mouth, act, GESTURES, EMOTIONS, gaze, motion, camera, THUMB_POSE, body, add, osc, smooth, hand, ripple,
  idle(i) { const a = motion.mixer.clipAction(motion.idle[i]); if (motion.base !== a) { if (motion.base) fadeTo(motion.base, 0, 0.3); fadeTo(a, 1, 0.3); } motion.base = a; motion.baseEnds = 1e9; return a.getClip().name; },
  get layers() { return [...layers].map(([a, l]) => `${a.getClip().name.split('/').pop()} ${l.w.toFixed(2)}→${l.target}`); },
  get mic() { return micVAD; },
  get vrm() { return vrm; },
  snap(name, p = 0.5, extra) {
    frozen = name != null ? { name, p, ...extra } : null;
    update(0.016, clock.elapsedTime);
    renderer.render(scene, camera);
    return renderer.domElement;
  },
};

// ?debug=1 — панель под строкой записи: запустить любой жест, лицо или цикл покоя кнопкой
function debugPanel() {
  const box = document.createElement('div');
  box.id = 'dbgpanel';
  box.style.cssText = 'position:fixed;top:44px;left:10px;z-index:6;max-width:340px;max-height:calc(100vh - 220px);'
    + 'overflow:auto;background:#0009;padding:6px 8px;border-radius:8px;font:13px sans-serif;color:#fff';
  const row = (title, items) => {
    if (!items.length) return;
    const h = document.createElement('div');
    h.textContent = title;
    h.style.cssText = 'margin:6px 0 3px;opacity:.7';
    const r = document.createElement('div');
    r.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px';
    for (const [label, run, hint] of items) {
      const b = document.createElement('button');
      b.textContent = label;
      b.title = hint || '';
      b.style.cssText = 'padding:3px 8px;font-size:13px';
      b.onclick = run;
      r.append(b);
    }
    box.append(h, r);
  };
  const names = [...new Set([...Object.keys(motion.gestures), ...Object.keys(GESTURES)])];
  row('жесты', names.map((n) => [n, () => act(n), motion.gestures[n] ? 'запись ' + motion.gestures[n].name : 'процедурный']));
  row('лицо', EMOTIONS.map((n) => [n, () => act(n)]));
  row('покой', motion.idle.map((c, i) => [String(i + 1), () => window.mika.idle(i), c.name]));
  row('', [['очистить очередь', () => { gestureQueue.length = 0; }]]);
  box.firstChild.style.marginTop = '0';
  document.body.append(box);
}
</script>
